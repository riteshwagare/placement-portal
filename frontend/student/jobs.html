<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">NextGen AI</div>
            <nav>
                <ul class="sidebar-nav">
                    <li><a href="dashboard.html">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                        Dashboard
                    </a></li>
                    <li><a href="upload.html">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                        Upload Resume
                    </a></li>
                    <li><a href="skills.html">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
                        My Skills
                    </a></li>
                    <li><a href="quiz.html">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
                        AI Quiz
                    </a></li>
                    <li><a href="jobs.html" class="active">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                        Job Recommendations
                    </a></li>
                    <li><a href="applications.html">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                        My Applications
                    </a></li>
                    <li><a href="courses.html">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                        Courses
                    </a></li>
                    <li><a href="profile.html">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                        Profile
                    </a></li>
                </ul>
            </nav>
            <div class="user-menu">
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">S</div>
                    <div class="user-details">
                        <h4 id="userName">Student</h4>
                        <p id="userEmail">student@email.com</p>
                    </div>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <h1>Job Recommendations</h1>
                <p>Jobs matched to your skills</p>
            </div>
            
            <!-- Your Skills -->
            <div class="card">
                <div class="card-header">
                    <h2>Your Skills</h2>
                    <a href="skills.html" class="btn btn-secondary">Manage Skills</a>
                </div>
                <div class="skills-container" id="userSkills">
                    <span class="skill-badge">Loading...</span>
                </div>
            </div>
            
            <!-- Jobs Grid -->
            <div id="jobsContainer">
                <div class="loading">
                    <div class="spinner"></div>
                </div>
            </div>
        </main>
    </div>
    
    <div class="toast-container" id="toastContainer"></div>
    
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        const user = checkAuth();
        if (user && user.role !== 'student') {
            redirectToDashboard(user.role);
        }
        
        let appliedJobs = [];
        
        // Update user info
        if (user) {
            document.getElementById('userName').textContent = user.name;
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('userAvatar').textContent = user.name.charAt(0).toUpperCase();
            
            // Display skills
            if (user.skills && user.skills.length > 0) {
                document.getElementById('userSkills').innerHTML = user.skills.map(skill => `
                    <span class="skill-badge">${skill}</span>
                `).join('');
            } else {
                document.getElementById('userSkills').innerHTML = `
                    <p style="color: var(--text-secondary);">No skills added yet. <a href="upload.html">Upload your resume</a> to get started.</p>
                `;
            }
            
            loadJobs();
        }
        
        async function loadJobs() {
            try {
                // Get applied jobs first
                const applicationsResponse = await api.getStudentApplications(user.id);
                if (applicationsResponse.success) {
                    appliedJobs = applicationsResponse.applications.map(app => app.job_id);
                }
                
                // Get job recommendations
                const response = await api.getJobRecommendations(user.id);
                
                if (response.success) {
                    renderJobs(response.jobs);
                }
            } catch (error) {
                document.getElementById('jobsContainer').innerHTML = `
                    <div class="empty-state">
                        <p>Failed to load jobs. Please try again.</p>
                    </div>
                `;
            }
        }
        
        function renderJobs(jobs) {
            const container = document.getElementById('jobsContainer');
            
            if (jobs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                        </svg>
                        <h3>No Jobs Available</h3>
                        <p>Check back later for new opportunities</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = `
                <div class="grid-2">
                    ${jobs.map(job => {
                        const matchClass = job.match_score >= 70 ? 'high' : job.match_score >= 40 ? 'medium' : 'low';
                        const isApplied = appliedJobs.includes(job.id);
                        
                        return `
                            <div class="job-card">
                                <h3>${job.title}</h3>
                                <p class="company">${job.company}</p>
                                ${job.match_score !== undefined ? `
                                    <span class="match-score ${matchClass}">${job.match_score}% Match</span>
                                ` : ''}
                                <div class="skills">
                                    ${job.skills_required.split(',').map(skill => `
                                        <span class="skill-tag">${skill.trim()}</span>
                                    `).join('')}
                                </div>
                                <p style="color: var(--text-secondary); margin-bottom: 12px; font-size: 14px;">
                                    ${job.description || 'No description available'}
                                </p>
                                ${job.salary ? `<p class="salary">${job.salary}</p>` : ''}
                                ${job.location ? `<p style="font-size: 14px; color: var(--text-secondary); margin-bottom: 16px;">Location: ${job.location}</p>` : ''}
                                ${isApplied ? `
                                    <button class="btn btn-secondary" disabled>Applied</button>
                                ` : `
                                    <button class="btn btn-primary" onclick="applyForJob(${job.id})">Apply Now</button>
                                `}
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }
        
        async function applyForJob(jobId) {
            try {
                const response = await api.applyForJob(user.id, jobId);
                
                if (response.success) {
                    showToast('Application submitted successfully!');
                    appliedJobs.push(jobId);
                    loadJobs(); // Refresh to update button states
                }
            } catch (error) {
                showToast(error.message || 'Failed to apply', 'error');
            }
        }
    </script>
</body>
</html>
